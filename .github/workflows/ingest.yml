name: Ingest Bookmark

on:
  issues:
    types: [labeled]

jobs:
  ingest:
    if: github.event.label.name == 'bookmark'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Extract URL from issue body
        id: parse
        run: |
          URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https?://[^\s]+' | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Run ingest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest "${{ steps.parse.outputs.url }}"

      - name: Commit new bookmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/bookmarks/ public/screenshots/
          git diff --staged --quiet || git commit -m "bookmark: ${{ steps.parse.outputs.url }}"
          git push

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Close issue with comment
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: |
            ✅ Bookmark ingested! It will appear on the site once the build completes.
            URL: ${{ steps.parse.outputs.url }}
